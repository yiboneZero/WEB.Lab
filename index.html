<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="빠르고 편리한 길이 단위 변환기 WEB.Lab">
  <title>WEB.Lab — 길이 단위 변환기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <a class="brand" href="./" aria-label="WEB.Lab 홈"><span>WEB</span>.Lab</a>
      <button id="themeButton" class="icon-button" type="button" aria-label="화면 테마 변경">◐</button>
    </header>

    <section class="hero">
      <p class="eyebrow">LENGTH CONVERTER</p>
      <h1>길이를 더 간단하게.</h1>
      <p class="intro">숫자를 입력하면 자주 쓰는 길이 단위로 즉시 변환합니다.</p>
    </section>

    <section class="converter" aria-label="길이 단위 변환기">
      <div class="field">
        <label for="amount">변환할 값</label>
        <input id="amount" type="number" inputmode="decimal" value="1" step="any" aria-describedby="status">
      </div>
      <div class="unit-row">
        <div class="field">
          <label for="fromUnit">기준 단위</label>
          <select id="fromUnit"></select>
        </div>
        <button id="swapButton" class="swap" type="button" aria-label="단위 서로 바꾸기">⇄</button>
        <div class="field">
          <label for="toUnit">변환 단위</label>
          <select id="toUnit"></select>
        </div>
      </div>
      <div class="result" aria-live="polite">
        <span id="status">변환 결과</span>
        <strong id="resultValue">100</strong>
        <span id="resultUnit">센티미터</span>
        <button id="copyButton" type="button">결과 복사</button>
      </div>
    </section>

    <section class="quick" aria-labelledby="quickTitle">
      <div class="section-heading">
        <h2 id="quickTitle">한눈에 보기</h2>
        <span id="baseLabel">1 미터 기준</span>
      </div>
      <div id="quickGrid" class="quick-grid"></div>
    </section>

    <footer>Designed for clarity · WEB.Lab</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
